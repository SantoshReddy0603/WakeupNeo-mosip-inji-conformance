name: inji-conformance-harness
services:
  mongodb:
    image: mongo:6.0.13
    volumes: [mongodb-data:/data/db]
    networks: [conformance]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  conformance-server:
    build:
      context: ./oidf
      args:
        OIDF_REF: ${OIDF_REF:-11999aad62ec292f36101410d9d5b761d44903ff}
    image: inji-harness/oidf:local
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/test_suite
      FINTECHLABS_BASE_URL: ${OIDF_PUBLIC_URL:-https://host.docker.internal:8443}
      FINTECHLABS_DEVMODE: 'true'
    volumes:
      - ./nginx/certs/server.crt:/local-trust/server.crt:ro
    depends_on:
      mongodb: {condition: service_healthy}
    networks: [conformance]

  conformance-httpd:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8443:8443']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./nginx/suite.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [conformance-server]
    networks: [conformance]

networks:
  conformance:
volumes:
  mongodb-data:

