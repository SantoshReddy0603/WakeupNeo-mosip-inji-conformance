server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;
    location /v1/verify/ {
        proxy_pass http://final-verify:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
