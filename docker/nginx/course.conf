server {
  listen 8080;
  root /public-wallet-keys;
  location / { try_files $uri =404; }
}
server {
  listen 8446 ssl;
  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $course_auth course-auth:8080;
  set $course_certify course-certify:8090;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  location = /.well-known/oauth-authorization-server/auth/realms/course {
    proxy_pass http://$course_auth/auth/realms/course/.well-known/oauth-authorization-server;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8446;
  }
  location = /course-logo.svg { root /assets; }
  location /auth/ {
    proxy_pass http://$course_auth;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8446;
  }
  location /.well-known/ {
    proxy_pass http://$course_certify/v1/certify$request_uri;
  }
  location /v1/certify/ {
    proxy_pass http://$course_certify;
  }
}
