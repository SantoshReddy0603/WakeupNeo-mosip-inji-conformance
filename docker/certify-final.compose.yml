name: inji-certify-final
services:
  course-database:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run runner/setup.py}
    volumes:
      - course-data:/var/lib/postgresql/data
      - ./certify-final-init:/docker-entrypoint-initdb.d:ro
    networks: [suite]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d inji_certify']
      interval: 5s
      timeout: 5s
      retries: 30
  course-auth:
    image: quay.io/keycloak/keycloak:26.4.0
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: https://host.docker.internal:8446/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: dpop
    volumes:
      - ./local/keycloak:/opt/keycloak/data/import:ro
      - course-auth-data:/opt/keycloak/data
    networks: [suite]
  course-certify:
    image: injistack/inji-certify-with-plugins:1.0.0-alpha.1
    user: root
    environment:
      container_user: inji
      active_profile_env: default,course
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/inji/config/
      enable_certify_artifactory: 'false'
      download_hsm_client: 'false'
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MOSIP_KERNEL_KEYMANAGER_HSM_KEYSTORE_PASS: ${CERTIFY_KEYSTORE_PASSWORD:?Run runner/setup.py}
      VERIFY_KEYSTORE_PASSWORD: ${VERIFY_KEYSTORE_PASSWORD}
      CERTIFY_KEYSTORE_PASSWORD: ${CERTIFY_KEYSTORE_PASSWORD}
    volumes:
      - ./certify-config:/home/inji/config:ro
      - ./local/certify-keys:/home/inji/CERTIFY_PKCS12
      - ./local/verify-keys:/keys:ro
    depends_on:
      course-database: {condition: service_healthy}
    networks: [suite]
  course-httpd:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8446:8443']
    volumes:
      - ./nginx/course.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./local/public-wallet-keys:/public-wallet-keys:ro
      - ./assets:/assets:ro
    depends_on: [course-certify, course-auth]
    networks: [suite]
networks:
  suite:
    external: true
    name: inji-conformance-harness_conformance
volumes:
  course-data:
  course-auth-data:
