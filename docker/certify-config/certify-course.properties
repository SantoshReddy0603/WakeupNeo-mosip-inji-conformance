mosip.certify.domain.url=https://host.docker.internal:8446
mosip.certify.metadata.signing.application-id=CERTIFY_VC_SIGN_EC_R1
mosip.certify.metadata.signing.reference-id=EC_SECP256R1_SIGN
mosip.certify.authorization.url=https://host.docker.internal:8446/auth/realms/course
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}
mosip.certify.authn.jwk-set-uri=http://course-auth:8080/auth/realms/course/protocol/openid-connect/certs
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential' }
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.scan-base-package=io.mosip.certify.postgresdataprovider.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin
mosip.certify.data-provider-plugin.postgres.scope-query-mapping={'course_completion': 'select learner_name, course_id, course_name, completed_on, cast(extract(epoch from now()) as bigint) as issued_at, cast(extract(epoch from now() + interval ''1 year'') as bigint) as expires_at from certify.course_completion where subject_id=:id'}
mosip.certify.database.hostname=course-database
mosip.kernel.keymanager.hsm.config-path=/home/inji/CERTIFY_PKCS12/local.p12
management.endpoint.env.show-values=NEVER
management.endpoints.web.exposure.include=health,info
mosip.certify.credential-config.issuer.display={{'name': 'Development Course Issuer', 'locale': 'en'}}
mosip.certify.data-provider-plugin.did-url=did:web:host.docker.internal%3A8446
mosip.certify.data-provider-plugin.id-field-prefix-uri=urn:inji:development:course:
mosip.certify.data-provider-plugin.rendering-template-id=
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
