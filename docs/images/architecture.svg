<g fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle"><text x="205" y="154">Programmatic runner</text><text x="555" y="154">Official OpenID suite</text><text x="900" y="148">Inji Certify / Verify</text><text x="205" y="354">Native API test rigs</text><text x="555" y="354">MinIO / S3</text><text x="900" y="354">Strict release gates</text></g>
<g fill="#b8cfdf" font-size="12" text-anchor="middle"><text x="205" y="181">Create • execute • poll • export</text><text x="555" y="181">Issuer + Final verifier plans</text><text x="900" y="175">Real issuance + verification</text><text x="900" y="197">Keycloak / PostgreSQL</text><text x="205" y="381">TestNG + Extent + combined report</text><text x="555" y="381">Upload + byte-for-byte read-back</text><text x="900" y="381">Independent + combined decisions</text></g>
