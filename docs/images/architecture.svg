<g font-family="Arial, sans-serif"><text x="40" y="48" fill="#ffffff" font-size="26" font-weight="700">One harness. Two real components. Honest release gates.</text><text x="40" y="77" fill="#a8c0d5" font-size="16">Docker Compose • official REST API • native TestNG / Extent • MinIO</text>
<g stroke="#58758c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M340 165H440"/><path d="M670 165H770"/><path d="M890 215V270H205V315"/><path d="M890 215V270H940V315"/><path d="M555 215V315"/><path d="M225 215V315"/><path d="M340 365H440"/><path d="M670 365H770"/></g>
