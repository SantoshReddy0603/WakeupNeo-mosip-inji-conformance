name: Code, native tests and reporting
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: code-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: runner/requirements*.txt
    - run: python -m pip install -r runner/requirements-ci.txt
    - name: Compile and statically check Python; parse shell entrypoints
      run: |-
        python -m compileall -q runner integration tests
        python -m ruff check runner integration tests --exclude runner/vendor --select F821,F822,F823
        python runner/validate_workflows.py
        bash -n run-conformance.sh
        bash -n run-full-stack-conformance.sh
    - run: python runner/setup.py
    - name: Validate all Compose configurations without starting services
      run: |-
        docker compose --env-file docker/.env -f docker/docker-compose.yml --profile certify --profile verify --profile storage config --quiet
    - run: python -m pytest tests -q --junitxml=reports/harness-tests.xml
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '11'
        cache: maven
        cache-dependency-path: '**/pom.xml'
    - name: Install checksum-verified Maven 3.8.7 baseline
      run: python3 runner/install_maven.py --directory "$RUNNER_TEMP/inji-tools"
    - run: mvn -B -f testrig/pom.xml test-compile
    - name: Execute real TestNG bridge regression fixtures
      run: python tests/validate_bridge.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: harness-tests
        path: |
          reports/harness-tests.xml
          testrig/target/bridge-fixtures/
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 45
  native-certify-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: inji/inji-certify
        ref: 8fdf71656979a72fa8263766d4dec3cc25127b76
        path: upstream/native-certify
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: '**/pom.xml'
    - name: Install checksum-verified Maven 3.8.7 baseline
      run: python3 runner/install_maven.py --directory "$RUNNER_TEMP/inji-tools"
    - name: Test native request and DPoP validation
      run: |
        git -C upstream/native-certify apply "$GITHUB_WORKSPACE/docker/native-certify/extensions.patch"
        git -C upstream/native-certify apply "$GITHUB_WORKSPACE/docker/native-certify/dpop.patch"
        git -C upstream/native-certify apply "$GITHUB_WORKSPACE/docker/native-certify/holder-binding.patch"
        git -C upstream/native-certify apply "$GITHUB_WORKSPACE/docker/native-certify/signed-metadata.patch"
        git -C upstream/native-certify apply "$GITHUB_WORKSPACE/docker/native-certify/credential-errors.patch"
        mvn -B -s integration/maven-settings.xml -f upstream/native-certify/pom.xml -pl certify-service -am package -Dtest=CredentialRequestExtensionTest,CredentialSelectorTest,DpopProofValidatorTest,AccessTokenValidationFilterTest,SDJwtHolderBindingTest,SignedIssuerMetadataServiceTest,CredentialErrorResponseTest -Dsurefire.failIfNoSpecifiedTests=false -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dsource.skip=true
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-certify-tests
        path: |-
          upstream/native-certify/**/target/surefire-reports/
          upstream/**/target/*.jar
        retention-days: 7
        if-no-files-found: error
  native-keymanager-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: mosip/keymanager
        ref: 7c53fc9d3c972347a603fd66e9ab0812db60ccec
        path: upstream/native-keymanager
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: '**/pom.xml'
    - name: Install checksum-verified Maven 3.8.7 baseline
      run: python3 runner/install_maven.py --directory "$RUNNER_TEMP/inji-tools"
    - name: Test native certificate generation
      run: |
        git -C upstream/native-keymanager apply "$GITHUB_WORKSPACE/docker/native-keymanager/positive-serial.patch"
        mvn -B -s integration/maven-settings.xml -f upstream/native-keymanager/kernel/pom.xml -pl kernel-keymanager-service -am package -Dtest=CertificateSerialNumberTest -Dsurefire.failIfNoSpecifiedTests=false -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dsource.skip=true
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-keymanager-tests
        path: |-
          upstream/native-keymanager/**/target/surefire-reports/
          upstream/**/target/*.jar
        retention-days: 7
        if-no-files-found: error
  api-rig-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
        - component: certify
          ref: 8fdf71656979a72fa8263766d4dec3cc25127b76
        - component: verify
          ref: 4c4289026968beb535d3dbdd500947152c43f708
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: mosip/mosip-functional-tests
        ref: 085cfa94301738d901c5b70547dbf005cb762c2b
        path: upstream/commons
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: inji/inji-${{ matrix.component }}
        ref: ${{ matrix.ref }}
        path: upstream/component
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: '**/pom.xml'
    - name: Install checksum-verified Maven 3.8.7 baseline
      run: python3 runner/install_maven.py --directory "$RUNNER_TEMP/inji-tools"
    - run: mvn -B -s integration/maven-settings.xml -f upstream/commons/pom.xml install -DskipTests -Dmaven.javadoc.skip=true
        -Dgpg.skip=true
    - name: Install and compile existing-module integration
      env:
        COMPONENT: ${{ matrix.component }}
      run: |-
        python integration/install.py "--$COMPONENT-repo" upstream/component
        mvn -B -s integration/maven-settings.xml -f upstream/component/api-test/pom.xml compile -DskipTests

        mvn -B -s integration/maven-settings.xml -f upstream/component/api-test/pom.xml dependency:build-classpath "-Dmdep.outputFile=$GITHUB_WORKSPACE/component.cp"
        python tests/validate_native_mapping.py --component "$COMPONENT" --repo upstream/component --classpath-file component.cp --output reports/native-mapping
        python tests/validate_independent_gates.py --component "$COMPONENT" --repo upstream/component --classpath-file component.cp --output reports/independent-gates
        if [[ "$COMPONENT" == certify ]]; then
          python tests/validate_independent_gates.py --component combined --output reports/combined-gates
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-api-mapping-${{ matrix.component }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
